<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>KIWI-KeyPad</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="18" height="18" rx="4" />
          <path d="M8 15l4-6 4 6" /></svg
        >KIWI-KeyPad
      </div>
      <button
        id="navToggle"
        type="button"
        aria-controls="nav"
        aria-expanded="false"
      >
        Menu
      </button>
      <nav id="nav" aria-label="Main"></nav>
      <div class="row">
        <button id="bTheme" aria-label="Toggle theme">◐</button
        ><button id="bMute" aria-label="Toggle sound mute (Alt+M)">♪</button>
      </div>
    </header>
    <main id="main"></main>
    <div
      class="modal"
      id="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="mt"
    >
      <div class="panel" id="panel"></div>
    </div>
    <div class="sr" id="live" aria-live="polite"></div>
    <input
      id="hid"
      autocomplete="off"
      autocapitalize="off"
      autocorrect="off"
      spellcheck="false"
      aria-label="Typing input"
    />
    <script src="main.js"></script>
    <script src="personalization.js"></script>
    <script src="themes-account.js"></script>
    <script src="game.js"></script>
    <script type="module" src="firebase-auth.js"></script>
  </body>
</html>
